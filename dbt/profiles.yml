sentinel:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH', '/opt/dagster/data/warehouse/sentinel.duckdb') }}"
      threads: 4
      # httpfs lets duckdb read parquet straight out of MinIO without a
      # python download step. s3 creds are picked up from env_var below.
      extensions:
        - httpfs
        - parquet
      settings:
        s3_endpoint: "{{ env_var('MINIO_ENDPOINT', 'minio:9000') }}"
        s3_access_key_id: "{{ env_var('MINIO_ACCESS_KEY', 'minio') }}"
        s3_secret_access_key: "{{ env_var('MINIO_SECRET_KEY', 'minio12345') }}"
        s3_url_style: "path"
        s3_use_ssl: false
